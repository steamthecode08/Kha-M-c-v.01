
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart-Tetris Mac OS Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #666699;
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            font-family: 'VT323', monospace;
            cursor: url('https://cur.cursors-4u.net/games/gam-4/gam372.cur'), auto;
        }
        /* Mac OS 8 Background Pattern Simulation */
        .mac-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #7d88c2;
            background-image: 
                linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }
        .mac-shadow {
            box-shadow: 1px 1px 0px #000, -1px -1px 0px #fff;
        }
        .mac-window {
            border: 1px solid #000;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            background-color: #cecece;
        }
        .mac-titlebar {
            background: repeating-linear-gradient(
                0deg,
                #cecece,
                #cecece 2px,
                #999 2px,
                #999 3px
            );
            border-bottom: 1px solid #000;
        }
        .mac-menu-bar {
            background-color: #fff;
            border-bottom: 1px solid #000;
            height: 22px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 14px;
            gap: 15px;
            color: #000;
            z-index: 100;
            position: absolute;
            top: 0;
            width: 100%;
        }
        .mac-menu-item {
            cursor: pointer;
            padding: 0 4px;
        }
        .mac-menu-item:hover {
            background-color: #3366cc;
            color: #fff;
        }
        .mac-icon {
            image-rendering: pixelated;
        }
        .pixelated {
            image-rendering: pixelated;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div class="mac-bg"></div>
</body>
</html>
